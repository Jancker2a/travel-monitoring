name: Weekly Hotel Specifications Enrichment KB

on:
  schedule:
    # Every Sunday at 03:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      max_hotels:
        description: "Максимальное количество отелей для обогащения (батч)"
        required: false
        default: "60"
      force:
        description: "Принудительно обновить уже обогащенные отели"
        required: false
        type: boolean
        default: false
      destination:
        description: "Направление для обогащения"
        required: false
        type: choice
        options:
          - all
          - turkey
          - egypt
          - cyprus
          - greece
        default: all

permissions:
  contents: write

concurrency:
  group: "hotel-specs-kb"
  cancel-in-progress: false

jobs:
  enrich-hotel-specs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.0-flash' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements_dashboard.txt

      - name: Run Hotel Specs Enrichment Pipeline
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --force"
          fi
          if [ -n "${{ github.event.inputs.max_hotels }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --max-hotels ${{ github.event.inputs.max_hotels }}"
          fi
          if [ -n "${{ github.event.inputs.destination }}" ] && [ "${{ github.event.inputs.destination }}" != "all" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --destination ${{ github.event.inputs.destination }}"
          fi

          echo "🚀 Executing scripts/enrich_hotel_specs.py with args: $EXTRA_ARGS"
          python scripts/enrich_hotel_specs.py $EXTRA_ARGS

      - name: Commit and push updated hotel_specs_kb.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hotel_specs_kb.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(kb): update verified hotel specifications knowledge base [skip ci]"
            git push origin HEAD
            echo "✅ hotel_specs_kb.json updated and committed"
          else
            echo "ℹ️ No changes in hotel_specs_kb.json to commit"
          fi

      - name: Summary Report
        if: always()
        run: |
          echo "## 🏨 Hotel Specifications Enrichment Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          if [ -f "hotel_specs_kb.json" ]; then
            TOTAL_ENRICHED=$(python -c "import json; print(json.load(open('hotel_specs_kb.json')).get('total_enriched', 0))")
            TOTAL_HOTELS=$(python -c "import json; print(len(json.load(open('hotel_specs_kb.json')).get('hotels', {})))")
            echo "**Total Enriched Hotels:** $TOTAL_ENRICHED / $TOTAL_HOTELS" >> $GITHUB_STEP_SUMMARY
          fi
